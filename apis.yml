aid: trace-neuroscience
name: Trace Neuroscience
description: 'Trace Neuroscience, Inc. is a biotechnology company developing genetic medicines for
  neurodegenerative diseases. Its lead investigational medicine, TRCN-1023, is designed to restore
  the function of the UNC13A protein, which is disrupted in most people living with amyotrophic
  lateral sclerosis (ALS). The company sponsors the FUNCtion ALS Phase 1/2 trial (NCT07674667)
  evaluating TRCN-1023 delivered by intrathecal injection. Trace Neuroscience is backed by GV and
  does not currently publish a public developer portal or APIs.'
